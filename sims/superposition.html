<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波的重疊原理與干涉</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f7fa;color:#1d2733;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 12px 36px}

  /* 黑色舞台 */
  .stage{background:#000;border-radius:16px;padding:14px 16px 12px;color:#fff;outline:none}
  .top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
  .explain-btn{background:#e8141b;color:#fff;border:3px solid #fff;font:inherit;font-weight:900;font-size:1.35rem;letter-spacing:.08em;padding:4px 14px;cursor:pointer;border-radius:2px;line-height:1.2}
  .explain-btn.off{background:#5a1013;color:#ffb3b5}
  .titles{text-align:center}
  .titles .t1{font-size:1.2rem;font-weight:800;letter-spacing:.05em}
  .titles .t2{font-size:2.3rem;font-weight:900;color:#ffef00;letter-spacing:.06em;line-height:1.2}
  .titles .t3{font-size:1rem;color:#cfd6dd;font-weight:700;margin-top:2px}
  .switches{display:grid;gap:4px;font-size:1rem;font-weight:800}
  .sw{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap;position:relative}
  .sw input{position:absolute;opacity:0;width:0;height:0}
  .sw .lab{min-width:2.6em}
  .sw .opt{color:#22c7c7;font-weight:600;font-size:.88rem}
  .sw .track{width:46px;height:22px;background:#fff;border-radius:3px;position:relative;flex:none}
  .sw .track::after{content:"◀";position:absolute;left:3px;top:0;font-size:16px;line-height:22px;color:#000;transition:left .15s}
  .sw input:checked + .track::after{content:"▶";left:27px}
  .sw input:focus-visible + .track{outline:2px solid #ffef00}

  .seggroups{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin:12px 0 6px}
  .seg{display:inline-flex;align-items:stretch;border:1px solid #3b4652;border-radius:10px;overflow:hidden}
  .seg .name{background:#1b2530;color:#9aa6b2;font-size:.82rem;font-weight:700;padding:0 10px;display:flex;align-items:center}
  .seg button{appearance:none;border:0;border-left:1px solid #3b4652;background:#0b1117;color:#dfe6ec;font:inherit;font-size:.95rem;font-weight:800;padding:8px 14px;cursor:pointer}
  .seg button:hover{background:#18222c}
  .seg button.on{background:#ffef00;color:#000}

  canvas{display:block;width:100%;cursor:pointer;touch-action:pan-y}
  .caption{min-height:3.2em;margin:4px 0 0;padding:8px 12px;border-radius:10px;background:#16202b;color:#e9eef3;font-size:1rem;line-height:1.55}
  .caption b{color:#ffef00}
  .caption .r{color:#ff5b5b;font-weight:700} .caption .bl{color:#6aa8ff;font-weight:700}
  .timeline{display:flex;align-items:center;gap:10px;margin-top:10px}
  .timeline input{flex:1;accent-color:#ffef00}
  .timeline span{font-size:.85rem;color:#9aa6b2;font-variant-numeric:tabular-nums;min-width:80px;text-align:right}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
  .readout{font-size:1rem;color:#dfe6ec;font-variant-numeric:tabular-nums;line-height:1.6}
  .readout .r{color:#ff6b6b;font-weight:800} .readout .bl{color:#79b2ff;font-weight:800} .readout .w{color:#ffef00;font-weight:900}
  .keys{display:flex;gap:6px;align-items:flex-end}
  .key{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:700;color:#fff}
  .key button{width:52px;height:50px;border:0;border-radius:3px;background:linear-gradient(#e6e6e6,#bdbdbd);font-size:1.5rem;font-weight:900;color:#111;cursor:pointer;line-height:1}
  .key button:active{background:#aaa}

  /* 下方控制區（白底） */
  .panel{background:#fff;border:1px solid #e3e8ee;border-radius:14px;padding:12px 14px;margin-top:12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 20px}
  .ctl label{display:flex;justify-content:space-between;font-size:.86rem;color:#6b7785;margin-bottom:2px}
  .ctl label b{color:#1d2733;font-variant-numeric:tabular-nums}
  .ctl input[type=range]{width:100%;height:26px}
  .ctl.red input{accent-color:#e03131} .ctl.blue input{accent-color:#1c64d9} .ctl.gray input{accent-color:#555}
  .custom{display:none;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed #e3e8ee} .custom.show{display:grid}
  .checks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;padding-top:10px;border-top:1px dashed #e3e8ee;font-size:.9rem}
  .checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .checks input{width:18px;height:18px;accent-color:#1d2733}
  .hint{font-size:.8rem;color:#6b7785;margin:8px 0 0}

  @media (max-width:760px){
    .top{grid-template-columns:1fr;justify-items:center}
    .titles .t2{font-size:1.7rem}
    .switches{grid-template-columns:1fr 1fr;gap:4px 14px}
    .explain-btn{font-size:1.05rem}
    .seg button{padding:7px 10px;font-size:.88rem}
  }
  html.embedded body{background:transparent}
  html.embedded .wrap{padding:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" tabindex="0" aria-label="波的重疊原理模擬，按 Enter 播放，空白鍵逐格前進">
    <div class="top">
      <button class="explain-btn" id="explainBtn" aria-pressed="true">講解</button>
      <div class="titles">
        <div class="t1">波的重疊原理</div>
        <div class="t2" id="modeTitle">建設性干涉</div>
        <div class="t3" id="shapeTitle">半正弦波</div>
      </div>
      <div class="switches">
        <label class="sw"><span class="lab" style="color:#fff">白線</span><span class="opt">隱藏</span><input type="checkbox" id="swW" checked><span class="track"></span><span class="opt">顯示</span></label>
        <label class="sw"><span class="lab" style="color:#ff3030">紅線</span><span class="opt">隱藏</span><input type="checkbox" id="swR" checked><span class="track"></span><span class="opt">顯示</span></label>
        <label class="sw"><span class="lab" style="color:#2f6bff">藍線</span><span class="opt">隱藏</span><input type="checkbox" id="swB" checked><span class="track"></span><span class="opt">顯示</span></label>
        <label class="sw"><span class="lab" style="color:#9a9a9a">格線</span><span class="opt">隱藏</span><input type="checkbox" id="swG"><span class="track"></span><span class="opt">顯示</span></label>
      </div>
    </div>

    <div class="seggroups">
      <div class="seg" role="group" aria-label="干涉情境"><span class="name">干涉</span>
        <button data-mode="con" class="on">建設性</button><button data-mode="des">破壞性</button><button data-mode="cus">自訂</button></div>
      <div class="seg" role="group" aria-label="脈波形狀"><span class="name">波形</span>
        <button data-shape="sin" class="on">半正弦波</button><button data-shape="tri">三角波</button></div>
      <div class="seg" role="group" aria-label="顯示方式"><span class="name">顯示</span>
        <button data-view="split" class="on">分開三層</button><button data-view="overlay">疊在一起</button></div>
    </div>

    <canvas id="cv" aria-label="繩上的兩個脈波相向前進並重疊"></canvas>
    <div class="caption" id="caption"></div>

    <div class="timeline">
      <input type="range" id="tSlider" min="0" max="1000" step="1" value="0" aria-label="時間軸">
      <span id="tVal"></span>
    </div>

    <div class="bottom">
      <div class="readout" id="readout"></div>
      <div class="keys">
        <div class="key"><button id="btnBack" aria-label="倒退一格">◀|</button>倒退</div>
        <div class="key"><button id="btnReset" aria-label="從頭開始">↺</button>重來</div>
        <div class="key"><button id="btnPlay" aria-label="播放或暫停（Enter 鍵）">▶</button>Enter鍵</div>
        <div class="key"><button id="btnStep" aria-label="前進一格（空白鍵）">▶|</button>空白鍵</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="grid2 custom" id="customBox">
      <div class="ctl red"><label>紅波（從左邊來）的高度 <b id="vA1"></b></label><input type="range" id="A1" min="-5" max="5" step="1"></div>
      <div class="ctl blue"><label>藍波（從右邊來）的高度 <b id="vA2"></b></label><input type="range" id="A2" min="-5" max="5" step="1"></div>
    </div>
    <div class="grid2">
      <div class="ctl gray"><label>播放速度 <b id="vSp"></b></label><input type="range" id="speed" min="0.25" max="1.5" step="0.25"></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="autoPause" checked> 完全重疊時自動暫停</label>
      <label><input type="checkbox" id="showVel"> 質點速度箭頭</label>
    </div>
    <p class="hint">點一下繩子上的任一位置可以選定質點（黃色虛線）。高度單位是「格」，打開格線就能數。</p>
  </div>
</div>

<script>
/* 被嵌入單元頁時：回報高度給外層頁面 */
(function(){
  if (window.parent === window) return;
  document.documentElement.classList.add("embedded");
  const send = () => window.parent.postMessage({type:"sim-height", h: document.documentElement.scrollHeight}, "*");
  window.addEventListener("load", send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
})();

(function(){
  const L = 60, W = 16, V = 10;            // 繩長 60 格、脈波寬 16 格、波速 10 格/秒
  const T_END = L / V;
  const T_FULL = (L + W) / 2 / V;          // 完全重疊
  const T_MEET = (L - W) / 2 / V;          // 開始接觸
  const T_APART = (L + 3*W) / 2 / V;       // 完全分開
  const DT_STEP = 0.5 / V;                 // 逐格：脈波前進半格
  const PRESET = {con:[4,4], des:[4,-4]};
  const C = {r:'#ff3b3b', b:'#3d7bff', y:'#ffef00', s:'#ffffff'};
  const S = {mode:'con', A1:4, A2:4, cA1:4, cA2:-2, shape:'sin', view:'split', t:0, playing:false, speed:0.5,
             showW:true, showR:true, showB:true, showG:false, explain:true, autoPause:true, paused_full:false, showVel:false, sel:30};
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  let G = {};

  /* ---------- 物理 ---------- */
  const f = (u, A) => {
    if (u < 0 || u > W) return 0;
    return S.shape === 'sin' ? A * Math.sin(Math.PI * u / W) : A * (1 - Math.abs(2*u/W - 1));
  };
  const y1 = (x, t) => f(V*t - x, S.A1);           // 紅波：向右
  const y2 = (x, t) => f(x - (L - V*t), S.A2);     // 藍波：向左
  const yy = (x, t) => y1(x,t) + y2(x,t);
  const vel = (x, t) => (yy(x, t + 1e-4) - yy(x, t - 1e-4)) / 2e-4;
  const fmt = n => { const r = Math.round(n*10)/10; return (Object.is(r,-0) ? 0 : r).toFixed(1); };
  const sgn = n => { const s = fmt(n); return n < -0.05 ? '(' + s + ')' : s; };
  const r1 = n => Math.round(n*10)/10;
  const sumR = (a, b) => fmt(r1(a) + r1(b));   // 顯示的和＝顯示的兩數相加，避免 2.8＋2.8＝5.7

  /* ---------- 版面：每一層是一條繩子 ---------- */
  function resize(){
    const dpr = window.devicePixelRatio || 1;
    const w = cv.parentElement.clientWidth - 32;
    const hand = Math.max(30, Math.min(64, w * 0.06));
    const u = (w - 2*hand - 16) / L;
    const pad = Math.max(1.3, hand * 0.45 / u);
    const ext = list => ({up: Math.max(pad, list.reduce((s,a) => s + Math.max(a,0), 0) + pad),
                          down: Math.max(pad, list.reduce((s,a) => s + Math.max(-a,0), 0) + pad)});
    const defs = S.view === 'split'
      ? [Object.assign({k:'r', title:'只有紅波時（紅波單獨造成的位移 y₁）', color:C.r}, ext([S.A1])),
         Object.assign({k:'b', title:'只有藍波時（藍波單獨造成的位移 y₂）', color:C.b}, ext([S.A2])),
         Object.assign({k:'s', title:'實際的繩子：y ＝ y₁ ＋ y₂', color:C.s}, ext([S.A1, S.A2]))]
      : [Object.assign({k:'s', title:'', color:C.s}, ext([S.A1, S.A2]))];
    const labelH = S.view === 'split' ? 22 : 6, gap = S.view === 'split' ? 12 : 4;
    let cur = 4;
    const lanes = defs.map(d => {
      const top = cur + labelH, mid = top + d.up*u, bottom = mid + d.down*u;
      cur = bottom + gap;
      return Object.assign({labelY: top - 10, top, mid, bottom}, d);
    });
    const H = Math.round(cur);
    cv.style.height = H + 'px'; cv.width = Math.round(w*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    G = {w, H, hand, u, x0: hand + 8, lanes, labelH};
    draw();
  }
  const px = x => G.x0 + x * G.u;
  const laneFn = k => k === 'r' ? y1 : k === 'b' ? y2 : yy;

  /* ---------- 畫手 ---------- */
  function drawHand(x, y, flip, alpha){
    const s = G.hand / 64;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(flip ? -s : s, s);
    ctx.fillStyle = '#f7c978'; ctx.strokeStyle = '#b97a1e'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-58,-14); ctx.quadraticCurveTo(-60,22,-40,26);
    ctx.lineTo(-6,26); ctx.quadraticCurveTo(2,26,2,19); ctx.quadraticCurveTo(2,13,-6,13);
    ctx.lineTo(-4,13); ctx.quadraticCurveTo(4,12,3,6); ctx.quadraticCurveTo(2,0,-6,1);
    ctx.lineTo(-4,1); ctx.quadraticCurveTo(4,-1,2,-7); ctx.quadraticCurveTo(0,-11,-8,-10);
    ctx.lineTo(-30,-12); ctx.quadraticCurveTo(-46,-24,-58,-14); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-26,13); ctx.lineTo(-6,13); ctx.moveTo(-26,1); ctx.lineTo(-6,1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-34,-12); ctx.quadraticCurveTo(-14,-20,4,-8); ctx.quadraticCurveTo(8,-3,1,-1);
    ctx.quadraticCurveTo(-14,-6,-30,-4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function arrow(X, y0, y1v, color, width, head){
    const d = y1v - y0, dir = Math.sign(d); if (!dir || Math.abs(d) < 2) return;
    head = Math.min(head, Math.abs(d));
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(X, y0); ctx.lineTo(X, y1v - dir*head*0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X, y1v); ctx.lineTo(X - head*0.75, y1v - dir*head); ctx.lineTo(X + head*0.75, y1v - dir*head); ctx.closePath(); ctx.fill();
  }
  function tag(text, x, y, color, align){
    ctx.font = '800 13px system-ui, sans-serif'; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(text, x, y);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
  }

  /* ---------- 繪圖 ---------- */
  function draw(){
    if (!G.w) return;
    const t = S.t, u = G.u, split = S.view === 'split';
    ctx.clearRect(0,0,G.w,G.H);
    const rBead = Math.max(2.8, u * 0.42);
    const sx = S.sel, SX = px(sx);

    G.lanes.forEach((ln, idx) => {
      const py = y => ln.mid - y * u;
      const fn = laneFn(ln.k);
      const visible = ln.k === 's' ? S.showW : ln.k === 'r' ? S.showR : S.showB;

      // 分隔線與標題
      if (split){
        if (idx) { ctx.strokeStyle = '#2a333d'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, ln.top - G.labelH - 2); ctx.lineTo(G.w - 8, ln.top - G.labelH - 2); ctx.stroke(); }
        ctx.font = '700 13px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillStyle = ln.k === 's' ? '#ffef00' : ln.color; ctx.fillText(ln.title, px(0), ln.labelY);
      }

      // 格線
      if (S.showG){
        const U = Math.floor(ln.up), D = Math.floor(ln.down);
        ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1; ctx.beginPath();
        for (let x=0; x<=L; x++){ ctx.moveTo(px(x), py(U)); ctx.lineTo(px(x), py(-D)); }
        for (let k=-D; k<=U; k++){ ctx.moveTo(px(0), py(k)); ctx.lineTo(px(L), py(k)); }
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '10px system-ui, sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
        for (let k=-D; k<=U; k++) if (k) ctx.fillText(k, px(0) - 3, py(k));
      }
      // 平衡位置
      ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.setLineDash([4,5]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px(0), py(0)); ctx.lineTo(px(L), py(0)); ctx.stroke(); ctx.setLineDash([]);

      if (!visible){
        if (split){ ctx.fillStyle = '#56616c'; ctx.font = '600 13px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('（已隱藏）', G.w/2, ln.mid); }
        return;
      }

      // 手：真實繩子那層用實色，單獨波那層淡一點
      const ha = ln.k === 's' ? 1 : 0.55;
      drawHand(px(0) - 2, py(fn(0,t)), false, ha);
      drawHand(px(L) + 2, py(fn(L,t)), true, ha);

      // 繩子與質點
      ctx.strokeStyle = ln.k === 's' ? 'rgba(255,255,255,.35)' : ln.color; ctx.globalAlpha = ln.k === 's' ? 1 : .45; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i=0; i<=L*4; i++){ const x=i/4; i ? ctx.lineTo(px(x), py(fn(x,t))) : ctx.moveTo(px(x), py(fn(x,t))); }
      ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = ln.color;
      for (let x=0; x<=L; x++){ ctx.beginPath(); ctx.arc(px(x), py(fn(x,t)), ln.k === 's' ? rBead : rBead*0.8, 0, Math.PI*2); ctx.fill(); }

      // 疊在一起模式：紅、藍單獨的波形畫成細虛線
      if (!split){
        const curve = (g, a, b, color) => {
          a = Math.max(0, a); b = Math.min(L, b); if (b <= a) return;
          ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.setLineDash([7,5]); ctx.beginPath();
          for (let x=a, first=true; x<=b+1e-9; x+=0.25, first=false){ first ? ctx.moveTo(px(x), py(g(x,t))) : ctx.lineTo(px(x), py(g(x,t))); }
          ctx.stroke(); ctx.setLineDash([]);
        };
        if (S.showR) curve(y1, V*t - W, V*t, C.r);
        if (S.showB) curve(y2, L - V*t, L - V*t + W, C.b);
      }

      // 速度箭頭（只在實際繩子上）
      if (S.showVel && ln.k === 's'){
        const vmax = Math.max(Math.abs(S.A1), Math.abs(S.A2), 1) * Math.PI * V / W * 2;
        for (let x=0; x<=L; x++){
          const v = vel(x,t); if (Math.abs(v) < vmax*0.04) continue;
          const Y0 = py(yy(x,t)); arrow(px(x), Y0, Y0 - v / vmax * u * 5, '#ffa31a', 2, 6);
        }
      }

      // 選定質點
      const val = fn(sx, t), Yv = py(val);
      if (ln.k === 's'){
        if (Math.abs(val) > 0.05) arrow(SX + rBead + 7, py(0), Yv, C.y, 3, 9);
        ctx.strokeStyle = C.y; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(SX, Yv, rBead + 4, 0, Math.PI*2); ctx.stroke();
        if (Math.abs(val) > 0.05) tag('y ＝ ' + sumR(y1(sx,t), y2(sx,t)), SX + rBead + 14, (py(0) + Yv)/2, C.y);
        if (!split){
          if (S.showR){ ctx.strokeStyle = C.r; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(SX, py(y1(sx,t)), 5, 0, Math.PI*2); ctx.stroke(); }
          if (S.showB){ ctx.strokeStyle = C.b; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(SX, py(y2(sx,t)), 5, 0, Math.PI*2); ctx.stroke(); }
        }
      } else {
        if (Math.abs(val) > 0.05) arrow(SX + rBead + 7, py(0), Yv, ln.color, 3, 9);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(SX, Yv, rBead + 3, 0, Math.PI*2); ctx.stroke();
        tag((ln.k === 'r' ? 'y₁ ＝ ' : 'y₂ ＝ ') + fmt(val), SX + rBead + 14, Math.abs(val) > 0.05 ? (py(0) + Yv)/2 : py(0) - 12, ln.color);
      }
    });

    // 黃色虛線：貫穿各層的同一個位置
    const top = G.lanes[0].top - (split ? 4 : 0), bot = G.lanes[G.lanes.length - 1].bottom;
    ctx.strokeStyle = 'rgba(255,239,0,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(SX, top); ctx.lineTo(SX, bot); ctx.stroke(); ctx.setLineDash([]);

    updateText();
  }

  /* ---------- 講解與讀數 ---------- */
  function phaseText(){
    const t = S.t, eps = 1e-6, A1 = S.A1, A2 = S.A2, split = S.view === 'split';
    const cancel = A1 === -A2 && A1 !== 0, same = A1 * A2 > 0;
    if (t < W/V - eps) return '兩端的手各抖動一下，產生兩個脈波：<span class="r">紅波</span>向右、<span class="bl">藍波</span>向左。';
    if (t < T_MEET - eps) return '兩個脈波相向前進，各自保持形狀。猜猜看：相遇時會<b>互相彈開</b>、<b>撞在一起消失</b>，還是<b>穿過去</b>？';
    if (Math.abs(t - T_FULL) < 0.026){
      if (cancel) return '完全重疊：兩波位移大小相等、方向相反，處處相消，繩子<b>瞬間變成一直線</b>，這就是<b>破壞性干涉</b>。打開「質點速度箭頭」看看：質點真的停住了嗎？';
      if (same) return '完全重疊：中央的位移 ＝ ' + fmt(A1) + ' ＋ ' + fmt(A2) + ' ＝ <b>' + fmt(A1 + A2) + ' 格</b>，兩波互相加強，這就是<b>建設性干涉</b>。';
      if (A1 && A2) return '完全重疊：一正一負，中央的位移 ＝ ' + sgn(A1) + ' ＋ ' + sgn(A2) + ' ＝ <b>' + fmt(A1 + A2) + ' 格</b>，互相削弱，屬於<b>破壞性干涉</b>。';
      return '完全重疊：其中一個波的高度是 0，所以繩子的形狀就是另一個波。';
    }
    if (t < T_APART - eps) return split
      ? '重疊中：沿著黃色虛線往下看，<b>最下層的位移 ＝ <span class="r">第一層</span> ＋ <span class="bl">第二層</span></b>，也就是 y ＝ y₁ ＋ y₂。這就是<b>波的重疊原理</b>。用空白鍵一格一格看，換幾個質點試試。'
      : '重疊中：白色質點的位移 ＝ <span class="r">紅虛線</span>的高度 ＋ <span class="bl">藍虛線</span>的高度，y ＝ y₁ ＋ y₂。這就是<b>波的重疊原理</b>。';
    if (t < T_END - eps) return '分開之後，兩個脈波<b>恢復原來的形狀</b>繼續前進，好像沒遇過對方一樣，這叫<b>波的獨立性</b>。';
    return '兩個脈波都抵達對面的手。按「↺ 重來」再看一次，或換一個情境、換一種波形。';
  }
  function updateText(){
    const cap = $('caption'); cap.style.display = S.explain ? '' : 'none'; if (S.explain) cap.innerHTML = phaseText();
    const a = y1(S.sel,S.t), b = y2(S.sel,S.t);
    $('readout').innerHTML = '選定質點（x ＝ ' + S.sel + ' 格）：<span class="w">y</span> ＝ <span class="r">y₁</span> ＋ <span class="bl">y₂</span> ＝ <span class="r">' + sgn(a) + '</span> ＋ <span class="bl">' + sgn(b) + '</span> ＝ <span class="w">' + sumR(a, b) + ' 格</span>';
    $('tVal').textContent = 't ＝ ' + S.t.toFixed(2) + ' s';
    if (!scrubbing) $('tSlider').value = Math.round(S.t / T_END * 1000);
    $('btnPlay').textContent = S.playing ? '❚❚' : '▶';
  }

  /* ---------- 控制 ---------- */
  function syncUI(){
    $('modeTitle').textContent = S.mode === 'con' ? '建設性干涉' : S.mode === 'des' ? '破壞性干涉' : '自訂兩個脈波';
    $('shapeTitle').textContent = S.shape === 'sin' ? '半正弦波' : '三角波';
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
    document.querySelectorAll('[data-shape]').forEach(b => b.classList.toggle('on', b.dataset.shape === S.shape));
    document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
    $('customBox').classList.toggle('show', S.mode === 'cus');
    $('A1').value = S.cA1; $('A2').value = S.cA2;
    $('vA1').textContent = (S.cA1 > 0 ? '+' : '') + S.cA1 + ' 格'; $('vA2').textContent = (S.cA2 > 0 ? '+' : '') + S.cA2 + ' 格';
    $('speed').value = S.speed; $('vSp').textContent = S.speed + '×';
    $('explainBtn').classList.toggle('off', !S.explain); $('explainBtn').setAttribute('aria-pressed', S.explain);
  }
  function setMode(m){
    S.mode = m;
    if (m === 'cus'){ S.A1 = S.cA1; S.A2 = S.cA2; } else { [S.A1, S.A2] = PRESET[m]; }
    syncUI(); S.t = 0; S.playing = false; S.paused_full = false; resize();
  }
  function restart(){ S.t = 0; S.playing = false; S.paused_full = false; draw(); }
  function togglePlay(){
    if (!S.playing && S.t >= T_END - 1e-6) { S.t = 0; S.paused_full = false; }
    S.playing = !S.playing; last = performance.now(); draw();
  }
  function step(d){
    S.playing = false;
    S.t = Math.min(T_END, Math.max(0, Math.round(S.t / DT_STEP + d) * DT_STEP));
    if (S.t < T_FULL - 1e-6) S.paused_full = false;
    draw();
  }

  $('btnPlay').onclick = togglePlay;
  $('btnStep').onclick = () => step(1);
  $('btnBack').onclick = () => step(-1);
  $('btnReset').onclick = restart;
  $('explainBtn').onclick = () => { S.explain = !S.explain; syncUI(); draw(); };
  [['swW','showW'],['swR','showR'],['swB','showB'],['swG','showG']].forEach(([id,k]) => $(id).onchange = e => { S[k] = e.target.checked; draw(); });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.querySelectorAll('[data-shape]').forEach(b => b.onclick = () => { S.shape = b.dataset.shape; syncUI(); draw(); });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; syncUI(); resize(); });
  $('A1').oninput = e => { S.cA1 = +e.target.value; S.A1 = S.cA1; syncUI(); resize(); };
  $('A2').oninput = e => { S.cA2 = +e.target.value; S.A2 = S.cA2; syncUI(); resize(); };
  $('speed').oninput = e => { S.speed = +e.target.value; syncUI(); };
  $('autoPause').onchange = e => { S.autoPause = e.target.checked; };
  $('showVel').onchange = e => { S.showVel = e.target.checked; draw(); };

  let scrubbing = false;
  const sl = $('tSlider');
  sl.addEventListener('pointerdown', () => { scrubbing = true; S.playing = false; });
  window.addEventListener('pointerup', () => { scrubbing = false; });
  sl.addEventListener('input', e => { S.playing = false; S.t = +e.target.value / 1000 * T_END; S.paused_full = S.t > T_FULL; draw(); });

  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left - G.x0) / G.u);
    if (x >= 0 && x <= L){ S.sel = x; draw(); }
    $('stage').focus({preventScroll:true});
  });

  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
    if (e.key === 'Enter'){ e.preventDefault(); togglePlay(); }
    else if (e.key === ' ' || e.code === 'Space'){ e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
  });

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (S.playing){
      let nt = S.t + dt * S.speed;
      if (S.autoPause && !S.paused_full && S.t < T_FULL && nt >= T_FULL){ nt = T_FULL; S.playing = false; S.paused_full = true; }
      if (nt >= T_END){ nt = T_END; S.playing = false; }
      S.t = nt; draw();
    }
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize', resize);
  syncUI(); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
